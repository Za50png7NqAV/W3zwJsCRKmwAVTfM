    <meta property="og:description" content="The Indian Army NCC Special Entry Scheme 125th Course (April 2027) notification has been released for 70 Short Service Commission (Non-Technical) vacancies for unmarried male NCC candidates, including 63 General and 07 Wards of Battle Casualties posts. Eligible candidates with a Bachelor&rsquo;s Degree, minimum &lsquo;B&rsquo; Grade in NCC &lsquo;C&rsquo; Certificate, and the required NCC service can apply online from 20/07/2026 to 20/08/2026. The selection process includes shortlisting, SSB Interview, medical examination, and merit list. Selected candidates will undergo 49 weeks of training at OTA Chennai and will be commissioned as Lieutenants in the Indian Army.">
