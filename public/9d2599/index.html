    <meta property="og:description" content="Western Coalfields Limited (WCL), a subsidiary of Coal India Limited, has released the WCL Recruitment 2026 Notification (Advertisement No. 2026/69) for 444 Statutory Supervisory Staff vacancies. The recruitment includes 220 Mining Sirdar posts and 224 Assistant Foreman (Trainee) (Electrical)/Electrical Supervisor posts. Eligible candidates can submit their online applications from 20 July 2026 to 10 August 2026. The selection process consists of a Computer-Based Test (CBT), followed by Document Verification and a Medical Examination. Selected candidates will receive an initial basic pay of ₹47,330.25 per month along with allowances and benefits as per NCWA XI. Candidates should carefully check the eligibility criteria, age limit, application fee, and other recruitment details before applying online.">
