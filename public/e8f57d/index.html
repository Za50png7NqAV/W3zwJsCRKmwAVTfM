    <meta property="og:description" content="Navodaya Vidyalaya Samiti has released the notification for Class 11th Lateral Entry Selection Test 2027-28 for admission against vacant seats in Jawahar Navodaya Vidyalayas. Online applications can be submitted up to 30/09/2026, and the Selection Test will be conducted on 10/04/2027. Candidates must be studying in Class X during the 2026-27 academic session in a Government/Government-recognized school of the district where the JNV is located, and must be Indian Nationals studying Class X in India, with a date of birth between 01/06/2010 and 31/07/2012. The test will consist of 100 objective questions for 100 marks from Mental Ability, English, Science, Social Science and Mathematics, with a duration of 2½ hours and no negative marking. Candidates can opt for a maximum of two streams, subject to available options and vacant seats. The application process is free of cost, and final admission will be subject to document verification, qualifying Class X and availability of seats.">
