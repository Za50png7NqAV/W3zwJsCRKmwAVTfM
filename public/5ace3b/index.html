    <meta property="og:description" content="The Indian Army JAG Entry Scheme 125th Course (April 2027) notification has been released for 10 Short Service Commission (SSC) vacancies in the Judge Advocate General (JAG) Branch. Unmarried male and female candidates holding an LLB degree with at least 55% marks from a Bar Council of India-recognized university are eligible to apply. Candidates must also have appeared in the CLAT PG 2026 examination and be eligible for registration as an advocate with the Bar Council of India/State. The online application process will be open from 17/07/2026 to 17/08/2026. Selection will be based on application shortlisting, SSB interview, medical examination, and merit list. Selected candidates will undergo 49 weeks of training at OTA Chennai, receive a ₹56,100 monthly stipend during training, and be commissioned as Lieutenants after successful completion.">
