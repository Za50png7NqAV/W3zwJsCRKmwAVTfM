    <meta property="og:description" content="AICTE YASHASVI (Young Achievers&rsquo; Scholarship and Holistic Academic Skills Venture Initiative) Scholarship Scheme भारत सरकार के अखिल भारतीय तकनीकी शिक्षा परिषद (AICTE) द्वारा संचालित एक मेरिट आधारित छात्रवृत्ति योजना है। इसका उद्देश्य आर्थिक रूप से कमजोर एवं मेधावी विद्यार्थियों को AICTE से मान्यता प्राप्त संस्थानों में Core Engineering Degree और Diploma पाठ्यक्रमों की पढ़ाई के लिए वित्तीय सहायता प्रदान करना है। योजना के अंतर्गत पात्र Degree छात्रों को ₹50,000 प्रति वर्ष तथा Diploma छात्रों को ₹30,000 प्रति वर्ष की छात्रवृत्ति DBT (Direct Benefit Transfer) के माध्यम से सीधे बैंक खाते में प्रदान की जाती है। आवेदन के लिए परिवार की वार्षिक आय ₹8 लाख या उससे कम होनी चाहिए तथा चयन 10वीं, 12वीं या Diploma के अंकों के आधार पर मेरिट सूची के अनुसार किया जाता है।">
