    <meta property="og:description" content="The Indira Gandhi Centre for Atomic Research (IGCAR), Kalpakkam, under the Department of Atomic Energy (DAE), Government of India, has released the IGCAR Trade Apprentice Recruitment 2026 notification for 200 ITI Trade Apprentice vacancies under the Apprentices Act, 1961. Eligible ITI pass candidates in the relevant trades can submit their online applications from 20 July 2026 to 19 August 2026. The apprenticeship training will be conducted for one year at IGCAR, Kalpakkam, Tamil Nadu. Selected apprentices will receive a monthly stipend of ₹11,040 (for 2-year ITI) or ₹10,560 (for 1-year ITI). Selection will be based on ITI marks, followed by document verification and a medical examination.">
