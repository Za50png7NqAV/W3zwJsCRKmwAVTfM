    <meta property="og:description" content="The Indian Space Research Organisation (ISRO) has released the Scientist/Engineer &lsquo;SC&rsquo; Recruitment 2026 notification to fill 92 vacancies across multiple engineering disciplines, including Electronics, Mechanical, Computer Science, Civil, Electrical, Refrigeration &amp; Air Conditioning, and Architecture. Candidates holding a BE/B.Tech or equivalent degree with a minimum of 65% marks (or 6.84 CGPA) and a valid GATE 2025 or GATE 2026 score in the relevant discipline are eligible to apply. The online application process started on 28 July 2026 and will remain open until 17 August 2026. The selection process consists of GATE score-based shortlisting followed by an Interview, and selected candidates will receive a starting basic pay of ₹56,100 per month (Level-10 Pay Matrix) along with Central Government allowances and benefits. Candidates are advised to read the official notification carefully before submitting the online application.">
