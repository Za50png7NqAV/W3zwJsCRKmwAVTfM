    <meta property="og:description" content="The State Bank of India (SBI) has released the Bank Medical Officer (BMO-II) Recruitment 2026 notification under the Specialist Cadre Officer (SCO) recruitment drive. A total of 35 vacancies have been announced across various SBI circles in India. Candidates with an MBBS degree recognized by the National Medical Commission (NMC) or State Medical Council and the required post-qualification experience are eligible to apply. The online application process will remain open from 24/06/2026 to 14/07/2026. The selection process includes an Online Written Test, Interview, and Local Language Proficiency Test (LLPT). Selected candidates will be appointed in Middle Management Grade Scale-II (MMGS-II) with an attractive salary package, allowances, and other benefits as per SBI rules.">
