    <meta property="og:description" content="कल्याणी सहायता योजना मध्य प्रदेश श्रम कल्याण बोर्ड द्वारा संचालित एक कल्याणकारी योजना है, जिसका उद्देश्य पंजीकृत औद्योगिक श्रमिक की मृत्यु के बाद उसकी पात्र विधवा को आर्थिक सहायता प्रदान करना है। इस योजना के तहत लाभार्थी को हर छह महीने में ₹6,000, अर्थात ₹12,000 प्रति वर्ष की सहायता राशि दी जाती है। आवेदन कर्मचारी की मृत्यु के एक वर्ष के भीतर करना आवश्यक है तथा सहायता जारी रखने के लिए प्रत्येक वर्ष यह प्रमाणित करना होता है कि विधवा जीवित है और उसने पुनर्विवाह नहीं किया है। योजना का लाभ प्राप्त करने के लिए मृत श्रमिक का मध्य प्रदेश श्रम कल्याण बोर्ड में पंजीकृत होना और निर्धारित पात्रता शर्तों का पूरा होना अनिवार्य है।">
