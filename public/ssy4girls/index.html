    <meta property="og:description" content="सुकन्या समृद्धि योजना 2026 बालिकाओं के भविष्य के लिए भारत सरकार की बचत योजना है। इसमें 10 वर्ष से कम उम्र की बेटी के नाम खाता खोला जा सकता है। न्यूनतम ₹250 और अधिकतम ₹1.50 लाख प्रति वित्तीय वर्ष जमा किए जा सकते हैं। आपके दिए गए विवरण के अनुसार वर्तमान ब्याज दर 8.2% प्रति वर्ष है। खाता 21 वर्ष में परिपक्व होता है और निर्धारित नियमों के तहत उच्च शिक्षा के लिए आंशिक निकासी की सुविधा मिलती है। जमा पर धारा 80-C के तहत कर लाभ भी उपलब्ध है।">
