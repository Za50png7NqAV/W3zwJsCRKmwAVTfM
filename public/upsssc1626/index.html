    <meta property="og:description" content="The Uttar Pradesh Subordinate Services Selection Commission (UPSSSC) has released the Preliminary Eligibility Test (PET) 2026 notification for candidates seeking future Group &lsquo;C&rsquo; Government Jobs in Uttar Pradesh. Eligible candidates who have passed High School (Class 10) or an equivalent examination can submit their online applications from 03 August 2026 to 01 September 2026 through the official UPSSSC portal. The application correction window will remain open until 08 September 2026. The minimum age required is 18 years, while the maximum age is 40 years as on 01 July 2026, with age relaxation applicable as per government rules. PET 2026 is a qualifying examination and does not announce any specific vacancies or post names. Candidates qualifying in PET will be eligible to apply for various future UPSSSC Group &lsquo;C&rsquo; recruitment notifications based on their PET score.">
