    <meta property="og:description" content="Bharat Petroleum Corporation Limited (BPCL) has released the Non-Management Recruitment 2026 notification for 154 vacancies in Mumbai Refinery and Kochi Refinery. The recruitment includes Process Technician (Chemical), Process Operator (Chemical), Technician/Operator (Mechanical), and Technician (Electrical) posts. Candidates with a full-time Diploma in the relevant engineering discipline along with 1 year of post-qualification experience or apprenticeship are eligible to apply. The online application process started on 29/07/2026 and will remain open until 13/08/2026. Selection will be based on a Computer Based Test (CBT), Skill/Proficiency Test (SPT), Document Verification, and Medical Examination. Selected candidates will receive a pay scale of ₹26,500–₹34,000 along with other BPCL allowances and benefits.">
