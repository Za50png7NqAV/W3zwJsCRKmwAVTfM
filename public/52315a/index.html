    <meta property="og:description" content="The Indian Space Research Organisation (ISRO) has released the URSC Apprentice Recruitment 2026-27 notification for 410 Apprentice posts at the U R Rao Satellite Centre (URSC), Bengaluru. The recruitment includes Graduate Apprentice (B.E./B.Tech.), Technician Apprentice (Diploma), and Commercial Practice Apprentice positions for a one-year apprenticeship training. Eligible candidates who completed their qualifying degree or diploma in 2022, 2023, 2024, 2025, or 2026 can apply online through the NATS and UMANG portals. The online application process started on 29/07/2026, and the last date to submit the application is 28/08/2026. There is no application fee for any category. Selection will be based on academic performance and document verification.">
