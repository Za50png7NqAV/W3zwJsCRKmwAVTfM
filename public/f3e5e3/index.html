    <meta property="og:description" content="The Railway Recruitment Cell (RRC), Northeast Frontier Railway (NFR) has released the Apprentices Recruitment 2026 notification for 6,777 Act Apprentice vacancies in various trades under the Apprentices Act, 1961. Eligible candidates who have passed Class 10 with ITI (NCVT/SCVT) in the relevant trade can apply online. For Medical Laboratory Technician trades, candidates must have passed 10th and 12th (PCB) with the required marks. The online application process will begin on 20/07/2026 and continue until 19/08/2026. Selection will be based on a merit list prepared from Matriculation and ITI marks, followed by Document Verification and Medical Examination. Interested candidates should read the official notification carefully before applying.">
